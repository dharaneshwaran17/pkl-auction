services:
  - type: web
    name: pkl-auction-live
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npx tsx scripts/prepare-db.ts && npm run build
    startCommand: npx tsx server.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # Connect your free external PostgreSQL (e.g. Neon.tech or Supabase to avoid Render 30-day DB expiration)
      - key: NEXT_PUBLIC_APP_URL
        sync: false # Set to your Render URL: https://pkl-auction-live.onrender.com
