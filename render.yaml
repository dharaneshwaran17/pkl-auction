services:
  - type: web
    name: pkl-auction-live
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx tsx server.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pkl-auction-db
          property: connectionString

databases:
  - name: pkl-auction-db
    plan: free
    region: oregon
    databaseName: pkl_auction
    user: pkl_admin
